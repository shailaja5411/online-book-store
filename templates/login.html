{% extends "base.html" %}

{% block title %}
Login - Online Book Store
{% endblock %}


{% block content %}

<section class="form-section">

    <h1>
        Login
    </h1>

    <form>

        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Enter your password"
        >


        <button type="submit" class="btn">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register here
        </a>

    </p>

</section>

{% endblock %}
