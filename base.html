<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Online Book Store
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            📚 BookStore
        </a>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('books_page') }}">
                Books
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

            <a href="{{ url_for('cart') }}">
                🛒 Cart
            </a>

            <a href="{{ url_for('orders') }}">
                Orders
            </a>

        </div>

    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>© 2026 BookStore. All rights reserved.</p>

</footer>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
