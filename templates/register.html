{% extends "base.html" %}

{% block title %}
Register - Online Book Store
{% endblock %}


{% block content %}

<section class="form-section">

    <h1>
        Create Account
    </h1>


    <form>

        <label>
            Name
        </label>

        <input
            type="text"
            placeholder="Enter your name"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Create a password"
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            placeholder="Confirm your password"
        >


        <button type="submit" class="btn">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login here
        </a>

    </p>

</section>

{% endblock %}
